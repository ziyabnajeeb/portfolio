name: Deploy Studio

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Sanity Studio
    runs-on: ubuntu-latest
    env:
      SANITY_STUDIO_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Studio
        working-directory: studio
        run: pnpm exec sanity deploy
